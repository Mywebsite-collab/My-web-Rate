<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شاركنا تقييمك</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #111827, #374151);
      font-family: Arial, Tahoma, sans-serif;
    }

    .rating-box {
      width: 100%;
      max-width: 460px;
      padding: 35px 25px;
      background: #ffffff;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 18px;
    }

    h1 {
      color: #111827;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    /* النجوم */
    .stars {
      direction: ltr;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin: 10px 0;
    }

    .star {
      border: 0;
      background: transparent;
      color: #d1d5db;
      font-size: 50px;
      line-height: 1;
      padding: 3px;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .star:hover {
      transform: scale(1.1);
    }

    .star.active {
      color: #fbbf24;
    }

    #ratingText {
      min-height: 25px;
      margin: 8px 0 20px;
      color: #6b7280;
      font-size: 14px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 115px;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      outline: none;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      direction: rtl;
    }

    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #4f46e5;
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .footer {
      margin-top: 22px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .rating-box {
        padding: 30px 18px;
      }

      h1 {
        font-size: 24px;
      }

      .star {
        font-size: 43px;
      }
    }
  </style>
</head>

<body>

  <main class="rating-box">

    <div class="icon">⭐</div>

    <h1>ما تقييمك لتجربتك؟</h1>

    <p class="subtitle">
      رأيك يهمنا ويساعدنا على تقديم تجربة أفضل
    </p>

    <!--
      Formspree القديم من موقعك
      سيتم إرسال التقييم والتعليق من خلاله
    -->
    <form
      id="ratingForm"
      action="https://formspree.io/f/myzwyrjk"
      method="POST"
    >

      <!-- النجوم -->
      <div
        class="stars"
        id="stars"
        role="radiogroup"
        aria-label="اختر تقييمك"
      >

        <button
          type="button"
          class="star"
          data-rating="1"
          aria-label="نجمة واحدة"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="2"
          aria-label="نجمتان"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="3"
          aria-label="ثلاث نجوم"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="4"
          aria-label="أربع نجوم"
        >★</button>

        <button
          type="button"
          class="star"
          data-rating="5"
          aria-label="خمس نجوم"
        >★</button>

      </div>

      <div id="ratingText">
        اختر عدد النجوم
      </div>

      <!-- التقييم الذي سيصل إلى البريد -->
      <input
        type="hidden"
        name="التقييم"
        id="ratingInput"
      >

      <!-- التعليق -->
      <textarea
        name="التعليق"
        id="comment"
        placeholder="اكتب رأيك هنا... (اختياري)"
      ></textarea>

      <!-- عنوان الرسالة التي تصل إلى Formspree -->
      <input
        type="hidden"
        name="_subject"
        value="⭐ تقييم جديد من موقعك"
      >

      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        إرسال التقييم
      </button>

      <!-- رسالة النجاح -->
      <div
        class="message success"
        id="successMessage"
      >
        ✅ تم إرسال تقييمك بنجاح، شكرًا لك!
      </div>

      <!-- رسالة الخطأ -->
      <div
        class="message error"
        id="errorMessage"
      >
        ❌ حدث خطأ أثناء إرسال التقييم. حاول مرة أخرى.
      </div>

    </form>

    <div class="footer">
      شكرًا لمشاركتك رأيك ❤️
    </div>

  </main>


  <script>

    /* =========================
       عناصر الصفحة
    ========================= */

    const form = document.getElementById("ratingForm");
    const stars = document.querySelectorAll(".star");
    const ratingInput = document.getElementById("ratingInput");
    const ratingText = document.getElementById("ratingText");
    const submitBtn = document.getElementById("submitBtn");
    const successMessage = document.getElementById("successMessage");
    const errorMessage = document.getElementById("errorMessage");


    /* =========================
       أسماء التقييمات
    ========================= */

    const ratingNames = {
      1: "سيئ جدًا 😞",
      2: "سيئ 😕",
      3: "متوسط 😐",
      4: "جيد 🙂",
      5: "ممتاز جدًا 🤩"
    };


    let selectedRating = 0;


    /* =========================
       تحديث النجوم
    ========================= */

    function updateStars(rating) {

      stars.forEach(function(star) {

        const value = Number(star.dataset.rating);

        if (value <= rating) {
          star.classList.add("active");
        } else {
          star.classList.remove("active");
        }

      });

    }


    /* =========================
       اختيار التقييم
    ========================= */

    stars.forEach(function(star) {

      star.addEventListener("click", function() {

        selectedRating = Number(this.dataset.rating);

        ratingInput.value = selectedRating + " / 5";

        ratingText.textContent =
          ratingNames[selectedRating];

        updateStars(selectedRating);

      });


      /* تأثير عند مرور الماوس */

      star.addEventListener("mouseenter", function() {

        const hoverRating =
          Number(this.dataset.rating);

        updateStars(hoverRating);

        ratingText.textContent =
          ratingNames[hoverRating];

      });

    });


    /* إعادة التقييم المختار بعد خروج الماوس */

    document
      .getElementById("stars")
      .addEventListener("mouseleave", function() {

        updateStars(selectedRating);

        if (selectedRating > 0) {

          ratingText.textContent =
            ratingNames[selectedRating];

        } else {

          ratingText.textContent =
            "اختر عدد النجوم";

        }

      });


    /* =========================
       إرسال النموذج إلى Formspree
    ========================= */

    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      /* التأكد من اختيار النجوم */

      if (selectedRating === 0) {

        alert("⭐ الرجاء اختيار تقييمك أولًا");

        return;
      }


      /* إخفاء الرسائل القديمة */

      successMessage.style.display = "none";
      errorMessage.style.display = "none";


      /* تعطيل الزر أثناء الإرسال */

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري إرسال التقييم...";


      try {

        const response = await fetch(
          form.action,
          {
            method: "POST",
            body: new FormData(form),
            headers: {
              "Accept": "application/json"
            }
          }
        );


        if (response.ok) {

          /* نجاح */

          successMessage.style.display = "block";

          errorMessage.style.display = "none";

          submitBtn.textContent =
            "تم إرسال التقييم ✓";


          /* تنظيف النموذج */

          form.reset();

          selectedRating = 0;

          updateStars(0);

          ratingText.textContent =
            "تم إرسال التقييم بنجاح";


          /* إعادة تفعيل الزر */

          setTimeout(function() {

            submitBtn.disabled = false;

            submitBtn.textContent =
              "إرسال تقييم جديد";

            ratingText.textContent =
              "اختر عدد النجوم";

          }, 2500);


        } else {

          throw new Error(
            "Formspree request failed"
          );

        }

      } catch (error) {

        /* فشل الإرسال */

        successMessage.style.display = "none";

        errorMessage.style.display = "block";

        submitBtn.disabled = false;

        submitBtn.textContent =
          "إرسال التقييم";

      }

    });

  </script>

</body>
</html>
